<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  <!-- Graduation cap -->
  <path d="M 20 45 L 50 30 L 80 45 L 80 55 L 50 70 L 20 55 Z" fill="white" opacity="0.95"/>
  <!-- Cap tassel -->
  <line x1="50" y1="30" x2="50" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="20" r="2" fill="white"/>
  <!-- Connection lines (representing mentorship connection) -->
  <circle cx="35" cy="50" r="3" fill="white" opacity="0.8"/>
  <circle cx="65" cy="50" r="3" fill="white" opacity="0.8"/>
  <line x1="35" y1="50" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="50" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
</svg>
